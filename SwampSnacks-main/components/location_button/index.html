<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- "📍 Use my location" button for the Search page.
     Asks the browser for GPS and sends {lat, lng, accuracy, ts} (or {error, ts}) back to Python.
     Plain HTML + the Streamlit component message protocol, so no extra packages are needed.
     Browsers only share location on https:// sites or http://localhost. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { padding: 2px; }
  button {
    width: 100%;
    height: 40px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: #0021A5;
    background: #ffffff;
    border: 2px solid #FA4616;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #FA4616; color: #ffffff; }
  button:disabled { cursor: wait; opacity: 0.75; }
</style>
</head>
<body>
<button id="btn" type="button">📍 Use my location</button>
<script>
  const btn = document.getElementById("btn");
  let busy = false;

  function label(active) {
    btn.textContent = active ? "📍 Update location" : "📍 Use my location";
  }

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }
  function setValue(value) {
    send("streamlit:setComponentValue", { value: value, dataType: "json" });
  }

  btn.addEventListener("click", function () {
    if (!navigator.geolocation) {
      setValue({ error: "This browser can't share its location.", ts: Date.now() });
      return;
    }
    busy = true;
    btn.disabled = true;
    btn.textContent = "Finding you…";
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        busy = false;
        btn.disabled = false;
        label(true);
        setValue({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          ts: Date.now()
        });
      },
      function (err) {
        busy = false;
        btn.disabled = false;
        label(false);
        const reasons = {
          1: "Location permission was blocked. Allow it in your browser, or pick a campus spot instead.",
          2: "Your device couldn't find its location. Pick a campus spot instead.",
          3: "Finding your location took too long. Try again, or pick a campus spot."
        };
        setValue({ error: reasons[err.code] || err.message, ts: Date.now() });
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  });

  // Tell Streamlit we're ready and how tall we are. Python passes `active` (is GPS in use?)
  // so the label resets to "Use my location" after the location is cleared with the ✕.
  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === "streamlit:render") {
      const args = event.data.args || {};
      if (!busy) label(!!args.active);
      send("streamlit:setFrameHeight", { height: document.body.scrollHeight });
    }
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: document.body.scrollHeight });
</script>
</body>
</html>
